# ============================================================
#  Finova Budget Tracker — Application Configuration
# ============================================================
spring.application.name=Sorman-budget-tracker
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ---------------- Datasource (NeonDB / PostgreSQL) ----------------
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://ep-snowy-dawn-apylzdc0-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_He7okq9tYLEn
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Production tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FinovaHikariPool

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ---------------- Security / JWT ----------------
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-256-bits-for-production-use}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=finova

# ---------------- Admin Bootstrap ----------------
app.admin.email=${ADMIN_EMAIL:admin@finova.io}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=Finova Admin

# ---------------- CORS ----------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------------- Springdoc / Swagger ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# ---------------- Actuator ----------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ---------------- Logging ----------------
logging.level.com.budgettracker=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
